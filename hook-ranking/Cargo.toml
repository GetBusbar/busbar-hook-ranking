# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-hook-ranking"
version = "1.6.0"
publish = false            # a first-party plugin crate; shipped linked into busbar or as a signed tarball
edition = "2021"
rust-version = "1.97"
description = "The ranking hook: cheapest / fastest / least_busy / usage order-gates over the hook kind's decide view."
license = "Apache-2.0"

[lib]
# rlib: the LINKED door (`door::door`), which a busbar build names as a compiled-in row. The
# dropped-in door is the sibling `busbar-hook-ranking-plugin` cdylib, which exports this same door
# as its one symbol; this crate exports none.
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (the plugin SDK is `busbar_contract::abi::sdk`). Pinned by
# git rev to the busbar commit in `.busbar-ref`.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "aa45738df3080c782f694b4668ed6729525bee69" }
# The settings document `open` reads (already in the contract's closure).
serde_json = "1"
