[package]
name = "busbar-hook-ranking"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The ranking hook for busbar: cheapest / fastest / least_busy / usage order-gates over the hook kind's decide view."

[lib]
# rlib: the LINKED door, which a busbar build names as a compiled-in row (`linked::door`, the root's
# `hooks-ranking` row on the hook axis). The dropped-in door is the sibling
# `busbar-hook-ranking-plugin` cdylib, which exports this same door as its one symbol; this crate
# exports none.
crate-type = ["rlib"]

# DEPENDENCY POLICY. A plugin's busbar closure is busbar-contract and nothing else; third-party crates
# come from the workspace table (`{ workspace = true }`), which is busbar's dependency policy. No
# plugin opens its own socket, dials, binds or does TLS: a connection is a declared need the kernel
# serves through the connector.
[dependencies]
busbar-contract = { workspace = true }
# The settings document `open` reads (already in the contract's closure).
serde_json = { workspace = true }
